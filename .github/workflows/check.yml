name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    name: Swift
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run checks
        run: Scripts/check.sh
